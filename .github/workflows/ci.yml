      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/rs-sage-core
          ref: 79fe9bbcd7a417a523d77a267c8420cf4f506746
          path: rs-sage-core
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sage/go.mod
          cache-dependency-path: sage/go.sum
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Observe bounded media decisions
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          python3 -B scripts/test_observe_reconciled_reg08_media.py
          python3 -B scripts/observe_reconciled_reg08_media.py \
            --spec-root ../sage-spec --go-root ../sage --rust-root ../rs-sage-core \
            --report "${RUNNER_TEMP}/reconciled-reg08-core-media.json"
      - name: Preserve bounded core observations
