  evidence:
    name: Evidence integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate frozen evidence and coverage
        run: |
          python3 scripts/test_close_inspection.py
          python3 -B scripts/test_core_lifecycle_evidence.py
          python3 -B scripts/check_core_lifecycle_evidence.py
          python3 -B scripts/test_registry_source_deployment_audit.py
          python3 -B scripts/check_registry_source_deployment_audit.py
          python3 -B scripts/test_agent_host_deployment_audit.py
          python3 -B scripts/check_agent_host_deployment_audit.py
          python3 -B scripts/test_mcp_client_provenance.py
          python3 -B scripts/check_mcp_client_provenance.py
          python3 -B scripts/test_ins11_integrated_verdict.py
          python3 -B scripts/check_ins11_integrated_verdict.py
          python3 scripts/test_concurrent_inspection.py
          python3 scripts/test_replay_inspection.py
          python3 scripts/test_deployment_inspection.py
          python3 scripts/test_evidence_integration.py
          python3 scripts/integrate_evidence.py --check --output docs/evidence/integrated.json
      - name: Run reference foundation self-check
        run: |
          mkdir -p evidence-run
          go run ./cmd/sage-conformance -suite vectors/0.10.0/foundation.json -report evidence-run/reference.json
          python3 - <<'PYMETA'
          import json, os, platform, subprocess
          from pathlib import Path
          data = dict(inspector_revision=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                      purpose='Evidence validation and reference self-check; no fresh core execution',
                      python=platform.python_version(), platform=platform.platform(),
                      go=subprocess.check_output(['go', 'version'], text=True).strip())
          Path('evidence-run/ci.json').write_text(json.dumps(data, indent=2) + '\n')
          PYMETA
      - name: Preserve evidence and reproduction inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence-run/
            docs/evidence/
            verification/0.10.0/
            vectors/0.10.0/
            scripts/
            .github/workflows/ci.yml
            go.mod
            go.sum

  record010:
    name: Record API bindings
