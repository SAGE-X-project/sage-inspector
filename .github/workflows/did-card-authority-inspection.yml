name: DID card authority inspection

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  did-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: sage-inspector
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SAGE-X-project/sage-spec
          ref: 06b50e177ccd22bce7d70fd80c2d7f822ae3fd3b
          path: sage-spec
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: sage-inspector/adapters/a2a-did-authority/go.sum
      - name: Record source identity and verify public dependencies
        working-directory: sage-inspector
        run: |
          mkdir "$RUNNER_TEMP/did-authority"
          git rev-parse HEAD > "$RUNNER_TEMP/did-authority/did-authority-revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/did-authority/did-authority-tree.txt"
          sha256sum scripts/did_authority_observation.py scripts/test_did_authority_observation.py scripts/check_did_authority_evidence.py scripts/owned_http_observation.py scripts/a2a_card_observation.py scripts/a2a_did_catalog.py scripts/current_spec_catalog.py adapters/a2a-did-authority/* vectors/0.10.0/a2a-did-authority-observations.json verification/0.10.0/a2a-did/did-authority* docs/did-card-authority-inspection.md .github/workflows/did-card-authority-inspection.yml > "$RUNNER_TEMP/did-authority/did-authority-source.sha256"
          python3 -B scripts/a2a_did_catalog.py --spec-root ../sage-spec --output "$RUNNER_TEMP/did-authority/did-authority-inventory.json"
          cd adapters/a2a-did-authority
          go mod download
          go mod verify
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum
      - name: Observe benign native exchanges before authored memory controls
        working-directory: sage-inspector
        run: python3 -B scripts/check_did_authority_evidence.py --run --directory "$RUNNER_TEMP/did-authority"
      - name: Test safe owned runtime and memory-only controls
        working-directory: sage-inspector/adapters/a2a-did-authority
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly -race -count=1 -json -coverprofile="$RUNNER_TEMP/did-authority/did-authority-cover.out" ./... > "$RUNNER_TEMP/did-authority/did-authority-tests.jsonl"
          go tool cover -func="$RUNNER_TEMP/did-authority/did-authority-cover.out" > "$RUNNER_TEMP/did-authority/did-authority-coverage.txt"
          cat "$RUNNER_TEMP/did-authority/did-authority-coverage.txt"
          awk '/^total:/ {sub(/%$/, "", $3); found=1; if ($3+0 < 90) exit 1} END {if (!found) exit 1}' "$RUNNER_TEMP/did-authority/did-authority-coverage.txt"
      - name: Recheck native bytes and attributed memory witnesses
        working-directory: sage-inspector
        run: |
          python3 -B scripts/check_did_authority_evidence.py --directory "$RUNNER_TEMP/did-authority"
          sha256sum --check "$RUNNER_TEMP/did-authority/did-authority-source.sha256"
          git diff --exit-code
      - name: Preserve separate native and memory-unit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: did-authority-inspection
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/did-authority/
