name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Audit independent HTTP envelope fixtures
        run: |
          node scripts/check_http_boundaries.js vectors/0.10.0/http-boundaries.json docs/evidence/http-boundary-proofs.json
          node scripts/check_jcs_literals.js vectors/0.10.0/http-envelope-primitives.json
          node scripts/check_envelope_signatures.js vectors/0.10.0/http-envelope-primitives.json
          python3 scripts/test_http_boundary_audit.py
          python3 scripts/test_http_inspection.py
          python3 -B scripts/test_wire_http_binding_suite.py
          python3 -B scripts/generate_wire_http_binding_suite.py
          python3 -B scripts/test_wire_http_binding_reports.py
          python3 -B scripts/check_wire_http_binding_reports.py
      - name: Audit independent HPKE fixtures
        run: |
          node scripts/check_hpke_vectors.js
          python3 scripts/test_hpke_inspection.py
      - name: Audit independent session fixtures
        run: |
          node scripts/check_session_vectors.js
          python3 scripts/test_session_inspection.py
      - name: Audit independent registry fixtures
        run: |
          node scripts/check_registry_vectors.js
          python3 scripts/test_registry_inspection.py
          python3 -B scripts/test_did_prefix_suite.py
          python3 -B scripts/test_did_prefix_reports.py
          python3 -B scripts/check_did_prefix_reports.py
      - name: Audit independent Execution Guard fixtures
        run: |
          node scripts/check_guard_vectors.js
          python3 scripts/test_guard_inspection.py
          python3 scripts/test_guard_primitive_reports.py
          python3 scripts/test_guard_reservation_reports.py
          python3 scripts/test_guard_dispatch_reports.py
          python3 scripts/test_guard_result_reports.py
          node scripts/generate_guard_client_vectors.js --check
          python3 scripts/test_guard_client_reports.py
          python3 scripts/generate_guard_mcp_vectors.py --check
          python3 scripts/test_guard_mcp_reports.py
          python3 scripts/generate_guard_rpc_vectors.py --check
          python3 scripts/test_guard_rpc_reports.py
          python3 scripts/test_guard_registry_reports.py
          python3 scripts/test_mcp_session_reports.py
          python3 scripts/test_guard_session_reports.py
          python3 scripts/test_mcp_setup.py
          python3 -B scripts/test_mcp_core_runtime.py
          python3 -B scripts/test_mcp_setup_interop.py
          python3 -B scripts/test_mcp_protected.py
          python3 -B scripts/test_mcp_evidence_audit.py
          python3 -B scripts/test_mcp_session_freshness.py
          python3 -B scripts/test_mcp_owner_admission.py
          python3 -B scripts/test_mcp_setup_cases.py
          python3 -B scripts/test_mcp_case_evidence.py
          python3 -B scripts/test_mcp_binding_evidence.py
          python3 -B scripts/test_mcp_adoption_review.py
          python3 -B scripts/test_normative_baseline.py
          python3 -B scripts/test_go_normative_review.py
          python3 -B scripts/test_rust_normative_review.py
      - name: Audit Guard binding readiness
        run: |
          python3 scripts/test_guard_binding.py
          status=0
          python3 scripts/inspect_guard_binding.py --output "${RUNNER_TEMP}/guard-binding-readiness" || status=$?
          test "$status" -eq 3
      - name: Preserve Guard binding readiness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-binding-readiness-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-binding-readiness/
      - name: Run Inspector contract tests and record results
        run: |
          go build -o "${RUNNER_TEMP}/sage-scenario-tests" ./cmd/sage-scenario
          go build -o "${RUNNER_TEMP}/sage-conformance-tests" ./cmd/sage-conformance
          python3 scripts/run_verification_tests.py --scenario "${RUNNER_TEMP}/sage-scenario-tests" --primitive "${RUNNER_TEMP}/sage-conformance-tests" --output "${RUNNER_TEMP}/inspector-tests"
      - name: Preserve Inspector test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspector-tests-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/inspector-tests/
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  spec:
    name: Legacy spec vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-spec
          ref: f4a4e7fbf71a665785984eef7609b2e8fabe833d
          path: .sage-spec
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the vectors
        run: go run ./cmd/sage-inspector vectors -dir .sage-spec/vectors

  wire-http-source:
    name: Check pinned wire and HTTP source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sage-inspector
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-spec
          ref: 44df132fee5925182018ce089dc82435cb353f8a
          path: sage-spec
      - name: Compare exact source bytes and Inspector cases
        run: |
          cd sage-inspector
          python3 -B scripts/generate_wire_http_binding_suite.py --spec-root ../sage-spec
          python3 -B scripts/test_wire_http_binding_suite.py
          python3 -B scripts/check_wire_http_binding_reports.py

  latest-spec:
    name: Latest spec inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sage-inspector
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-spec
          ref: 44df132fee5925182018ce089dc82435cb353f8a
          path: sage-spec
      - name: Check the latest case graph and source files
        run: |
          cd sage-inspector
          python3 -B scripts/test_latest_spec_catalog.py
          python3 -B scripts/latest_spec_catalog.py --spec-root ../sage-spec --report "${RUNNER_TEMP}/latest-spec-inventory.json"
          python3 -B scripts/test_latest_spec_case_bindings.py
          python3 -B scripts/test_latest_spec_evidence.py
          python3 -B scripts/latest_spec_case_bindings.py --spec-root ../sage-spec
          python3 -B scripts/latest_spec_evidence.py --output "${RUNNER_TEMP}/latest-spec-evidence.json"
          python3 -B scripts/generate_did_prefix_suite.py --spec-root ../sage-spec
      - name: Preserve the latest inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latest-spec-inventory-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            ${{ runner.temp }}/latest-spec-inventory.json
            ${{ runner.temp }}/latest-spec-evidence.json

  reconciled-spec:
    name: Current normative spec and REG-08 media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sage-inspector
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-spec
          ref: dcdd028b5160de5e32eb1f43cf1f71eed3fc4744
          path: sage-spec
      - name: Check the revision-bound inventory and media decisions
        run: |
          cd sage-inspector
          python3 -B scripts/test_reconciled_spec_catalog.py
          python3 -B scripts/test_reconciled_spec_reg08_media.py
          python3 -B scripts/reconciled_spec_catalog.py --spec-root ../sage-spec --report "${RUNNER_TEMP}/reconciled-spec-inventory.json"
          python3 -B scripts/reconciled_spec_reg08_media.py --spec-root ../sage-spec --report "${RUNNER_TEMP}/reconciled-reg08-media.json"
      - name: Preserve revision-bound reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconciled-spec-inventory-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            ${{ runner.temp }}/reconciled-spec-inventory.json
            ${{ runner.temp }}/reconciled-reg08-media.json

