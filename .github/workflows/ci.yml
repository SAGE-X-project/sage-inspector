name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Audit independent HTTP envelope fixtures
        run: |
          node scripts/check_http_boundaries.js vectors/0.10.0/http-boundaries.json docs/evidence/http-boundary-proofs.json
          node scripts/check_jcs_literals.js vectors/0.10.0/http-envelope-primitives.json
          node scripts/check_envelope_signatures.js vectors/0.10.0/http-envelope-primitives.json
          python3 scripts/test_http_boundary_audit.py
          python3 scripts/test_http_inspection.py
      - name: Audit independent HPKE fixtures
        run: |
          node scripts/check_hpke_vectors.js
          python3 scripts/test_hpke_inspection.py
      - name: Audit independent session fixtures
        run: |
          node scripts/check_session_vectors.js
          python3 scripts/test_session_inspection.py
      - name: Audit independent registry fixtures
        run: |
          node scripts/check_registry_vectors.js
          python3 scripts/test_registry_inspection.py
      - name: Audit independent Execution Guard fixtures
        run: |
          node scripts/check_guard_vectors.js
          python3 scripts/test_guard_inspection.py
      - name: Run Inspector contract tests and record results
        run: |
          go build -o "${RUNNER_TEMP}/sage-scenario-tests" ./cmd/sage-scenario
          go build -o "${RUNNER_TEMP}/sage-conformance-tests" ./cmd/sage-conformance
          python3 scripts/run_verification_tests.py --scenario "${RUNNER_TEMP}/sage-scenario-tests" --primitive "${RUNNER_TEMP}/sage-conformance-tests" --output "${RUNNER_TEMP}/inspector-tests"
      - name: Preserve Inspector test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inspector-tests-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/inspector-tests/
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  spec:
    name: Legacy spec vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-spec
          ref: f4a4e7fbf71a665785984eef7609b2e8fabe833d
          path: .sage-spec
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the vectors
        run: go run ./cmd/sage-inspector vectors -dir .sage-spec/vectors

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  evidence:
    name: Evidence integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate frozen evidence and coverage
        run: |
          python3 scripts/test_close_inspection.py
          python3 scripts/test_concurrent_inspection.py
          python3 scripts/test_replay_inspection.py
          python3 scripts/test_deployment_inspection.py
          python3 scripts/test_evidence_integration.py
          python3 scripts/integrate_evidence.py --check --output docs/evidence/integrated.json
      - name: Run reference foundation self-check
        run: |
          mkdir -p evidence-run
          go run ./cmd/sage-conformance -suite vectors/0.10.0/foundation.json -report evidence-run/reference.json
          python3 - <<'PYMETA'
          import json, os, platform, subprocess
          from pathlib import Path
          data = dict(inspector_revision=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                      purpose='Evidence validation and reference self-check; no fresh core execution',
                      python=platform.python_version(), platform=platform.platform(),
                      go=subprocess.check_output(['go', 'version'], text=True).strip())
          Path('evidence-run/ci.json').write_text(json.dumps(data, indent=2) + '\n')
          PYMETA
      - name: Preserve evidence and reproduction inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence-run/
            docs/evidence/
            verification/0.10.0/
            vectors/0.10.0/
            scripts/
            .github/workflows/ci.yml
            go.mod
            go.sum

  record010:
    name: Record API bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: sage-inspector
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SAGE-X-project/sage
          ref: ff31edd485644a37cb4d27b94e029cf97ea5a14b
          path: sage
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SAGE-X-project/rs-sage-core
          ref: 768fde4d368635363ddd4b810a3ffac93079f98b
          path: rs-sage-core
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: sage-inspector/go.mod
          cache-dependency-path: sage-inspector/adapters/go/go.sum
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build pinned record adapters and verify local records
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          go build -o "${RUNNER_TEMP}/sage-conformance-record010" ./cmd/sage-conformance
          (cd adapters/go && go build -o "${RUNNER_TEMP}/sage-go-record010" .)
          cargo build --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust"
          python3 scripts/test_record010_adapters.py --go "${RUNNER_TEMP}/sage-go-record010" --rust "${RUNNER_TEMP}/record010-rust/debug/sage-inspector-rust-adapter" --runner "${RUNNER_TEMP}/sage-conformance-record010" --output "${RUNNER_TEMP}/record010-results"
      - name: Verify retained record sessions
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          go build -o "${RUNNER_TEMP}/sage-scenario-record010" ./cmd/sage-scenario
          (cd adapters/go && go test -race ./cmd/sage-record010-state && go build -o "${RUNNER_TEMP}/sage-go-record010-state" ./cmd/sage-record010-state)
          cargo test --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin record010_state
          python3 scripts/test_record010_state.py --go "${RUNNER_TEMP}/sage-go-record010-state" --rust "${RUNNER_TEMP}/record010-rust/debug/record010_state" --runner "${RUNNER_TEMP}/sage-scenario-record010" --output "${RUNNER_TEMP}/record010-results/stateful"
      - name: Verify transcript-bound HPKE seed and ACK bindings
        working-directory: sage-inspector
        run: |
          node scripts/check_hpke_vectors.js
          python3 scripts/test_hpke010_adapters.py --go "${RUNNER_TEMP}/sage-go-record010" --rust "${RUNNER_TEMP}/record010-rust/debug/sage-inspector-rust-adapter" --output "${RUNNER_TEMP}/record010-results/hpke010"
      - name: Preserve record binding test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: record010-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/record010-results/
