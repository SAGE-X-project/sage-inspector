        with:
          go-version-file: sage-inspector/go.mod
          cache-dependency-path: sage-inspector/adapters/go/go.sum
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Audit Guard deployment integration prerequisites
        working-directory: sage-inspector
        run: |
          status=0
          python3 scripts/inspect_guard_integration.py --go-root ../sage --rust-root ../rs-sage-core --output "${RUNNER_TEMP}/guard-integration-readiness" || status=$?
          test "$status" -eq 3
      - name: Preserve Guard integration review
