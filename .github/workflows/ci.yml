  mcp-native-setup:
    name: Native MCP interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage
          ref: 1f2dd87643e42b7ed3beda6956158ff23dcc7ea2
          path: .mcp-go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/rs-sage-core
          ref: 40b5a8c6d76d952131013d8a034f819fd31b7ca0
          path: .mcp-rust
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-spec
          ref: 520e5ed9a896ff8ba8ade776484f41084957aaa2
          path: .sage-spec-normative
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .mcp-go/go.mod
          cache-dependency-path: .mcp-go/go.sum
      - name: Prepare Rust dependencies
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo fetch --manifest-path .mcp-rust/Cargo.toml
      - name: Verify owner admission, signature, timeout and cleanup schedules
        run: |
          python3 -B scripts/check_normative_baseline.py --spec-root .sage-spec-normative --go-root .mcp-go --rust-root .mcp-rust --output "${RUNNER_TEMP}/normative-baseline"
          python3 -B scripts/check_go_normative_review.py --spec-root .sage-spec-normative --go-root .mcp-go --output "${RUNNER_TEMP}/go-normative-review"
          python3 -B scripts/check_rust_normative_review.py --spec-root .sage-spec-normative --rust-root .mcp-rust --output "${RUNNER_TEMP}/rust-normative-review"
          python3 -B scripts/check_mcp_owner_admission.py --go-root .mcp-go --rust-root .mcp-rust --output "${RUNNER_TEMP}/mcp-owner-admission"
          python3 -B scripts/check_mcp_signature_boundary.py --go-root .mcp-go --rust-root .mcp-rust --output "${RUNNER_TEMP}/mcp-signature-boundary"
          python3 -B scripts/run_mcp_core_runtime.py --go .mcp-go --rust .mcp-rust --output "${RUNNER_TEMP}/mcp-core-runtime"
      - name: Run actual native setup bridges
        run: python3 -B scripts/run_mcp_setup_interop.py --go .mcp-go --rust .mcp-rust --output "${RUNNER_TEMP}/mcp-native-setup"
      - name: Run protected calls and reopen completed journals
        run: python3 -B scripts/run_mcp_setup_interop.py --restart --go .mcp-go --rust .mcp-rust --output "${RUNNER_TEMP}/mcp-native-protected"
      - name: Verify all authenticated MCP setup cases
        run: |
          python3 -B scripts/check_mcp_setup_cases.py --runtime "${RUNNER_TEMP}/mcp-core-runtime" --interop "${RUNNER_TEMP}/mcp-native-protected" --output "${RUNNER_TEMP}/mcp-setup-cases"
          python3 -B scripts/check_mcp_case_evidence.py --runtime "${RUNNER_TEMP}/mcp-core-runtime" --setup "${RUNNER_TEMP}/mcp-setup-cases" --output "${RUNNER_TEMP}/mcp-case-evidence"
          python3 -B scripts/check_mcp_binding_evidence.py --runtime "${RUNNER_TEMP}/mcp-core-runtime" --parents "${RUNNER_TEMP}/mcp-case-evidence" --interop "${RUNNER_TEMP}/mcp-native-protected" --output "${RUNNER_TEMP}/mcp-binding-evidence"
      - name: Recheck saved MCP evidence
        run: python3 -B scripts/audit_mcp_evidence.py --evidence "${RUNNER_TEMP}/mcp-native-protected" > "${RUNNER_TEMP}/mcp-native-audit.json"
      - name: Preserve native interoperability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-native-interop-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/mcp-native-audit.json
            ${{ runner.temp }}/normative-baseline/
            ${{ runner.temp }}/go-normative-review/
            ${{ runner.temp }}/rust-normative-review/
            ${{ runner.temp }}/mcp-core-runtime/
            ${{ runner.temp }}/mcp-owner-admission/
            ${{ runner.temp }}/mcp-signature-boundary/
            ${{ runner.temp }}/mcp-case-evidence/
            ${{ runner.temp }}/mcp-binding-evidence/
            ${{ runner.temp }}/mcp-setup-cases/
            ${{ runner.temp }}/mcp-native-setup/
            ${{ runner.temp }}/mcp-native-protected/

