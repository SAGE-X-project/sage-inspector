name: Frozen design inspection

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sage-inspector
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-spec
          ref: 85fee1830b2bc0d2420557df40796ae83073de12
          path: sage-spec
      - name: Check source ownership and inspection contracts
        working-directory: sage-inspector
        env:
          SAGE_SPEC_ROOT: ../sage-spec
        run: |
          python3 -B scripts/test_design_baseline_catalog.py
          python3 -B scripts/test_design_baseline_evidence.py
          python3 -B scripts/test_run_design_baseline_cases.py
          python3 -B scripts/design_baseline_catalog.py --spec-root ../sage-spec --report "${RUNNER_TEMP}/design-baseline-catalog.json"
          python3 -B scripts/design_baseline_evidence.py --output "${RUNNER_TEMP}/design-baseline-evidence.json"
      - name: Preserve the exact no-subject report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-baseline-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            ${{ runner.temp }}/design-baseline-catalog.json
            ${{ runner.temp }}/design-baseline-evidence.json
