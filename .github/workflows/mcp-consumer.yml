name: External MCP consumer binding

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consumer:
    name: Independent external MCP consumers and issuance transfer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage
          ref: 11b1cd91691de99fdbd734db78dc6755c187b2e9
          path: .sage-go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/rs-sage-core
          ref: cf3edb86a04e8ca0141b252c85e002c1f49bf9eb
          path: .sage-rust
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.88.0'
      - name: Fetch public dependencies
        run: |
          (cd .sage-go && go mod download)
          cp verification/0.10.0/intent-issuance/Cargo.lock .sage-rust/Cargo.lock
          cargo fetch --locked --manifest-path .sage-rust/Cargo.toml
          python3 -m venv "${RUNNER_TEMP}/consumer-venv"
          "${RUNNER_TEMP}/consumer-venv/bin/pip" install 'cryptography==50.0.0'
      - name: Verify saved evidence and rejection units
        run: |
          "${RUNNER_TEMP}/consumer-venv/bin/python" -B scripts/inspect_mcp_consumer.py
          "${RUNNER_TEMP}/consumer-venv/bin/python" -B scripts/test_mcp_consumer.py
      - name: Build external public consumers and observe inert localhost exchanges
        run: |
          "${RUNNER_TEMP}/consumer-venv/bin/python" -B scripts/inspect_mcp_consumer.py \
            --go-root .sage-go --rust-root .sage-rust \
            --output "${RUNNER_TEMP}/mcp-consumer.json"
      - name: Preserve independent consumer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-consumer-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/mcp-consumer.json
