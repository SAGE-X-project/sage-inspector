name: Public native MCP host interop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-mcp:
    name: Independent public MCP host and TCP exchange
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage
          ref: 6a99b558a18d9c33ae9a07ce2ffa75af495661d0
          path: .sage-go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/rs-sage-core
          ref: cc83fba11d0e155d31af67dbdd840c9ab8cb0d9e
          path: .sage-rust
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.88.0'
      - name: Fetch public dependencies
        run: |
          (cd .sage-go && go mod download)
          cp verification/0.10.0/intent-issuance/Cargo.lock .sage-rust/Cargo.lock
          cargo fetch --locked --manifest-path .sage-rust/Cargo.toml
          python3 -m venv "${RUNNER_TEMP}/public-mcp-venv"
          "${RUNNER_TEMP}/public-mcp-venv/bin/pip" install 'cryptography==50.0.0'
      - name: Verify saved evidence and rejection units
        run: |
          "${RUNNER_TEMP}/public-mcp-venv/bin/python" -B scripts/inspect_public_mcp_host.py
          "${RUNNER_TEMP}/public-mcp-venv/bin/python" -B scripts/test_public_mcp_host.py
      - name: Observe public compilers and native localhost exchange
        run: |
          "${RUNNER_TEMP}/public-mcp-venv/bin/python" -B scripts/inspect_public_mcp_host.py \
            --go-root .sage-go --rust-root .sage-rust \
            --output "${RUNNER_TEMP}/public-mcp-host.json"
      - name: Preserve independent native MCP evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-mcp-host-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/public-mcp-host.json
