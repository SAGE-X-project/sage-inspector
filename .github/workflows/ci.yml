name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Audit independent HTTP envelope fixtures
        run: |
          node scripts/check_http_boundaries.js vectors/0.10.0/http-boundaries.json docs/evidence/http-boundary-proofs.json
          node scripts/check_jcs_literals.js vectors/0.10.0/http-envelope-primitives.json
          node scripts/check_envelope_signatures.js vectors/0.10.0/http-envelope-primitives.json
          python3 scripts/test_http_boundary_audit.py
          python3 scripts/test_http_inspection.py
      - name: Audit independent HPKE fixtures
        run: |
          node scripts/check_hpke_vectors.js
          python3 scripts/test_hpke_inspection.py
      - name: Audit independent session fixtures
        run: |
          node scripts/check_session_vectors.js
          python3 scripts/test_session_inspection.py
      - name: Audit independent registry fixtures
        run: |
          node scripts/check_registry_vectors.js
          python3 scripts/test_registry_inspection.py
      - name: Audit independent Execution Guard fixtures
        run: |
          node scripts/check_guard_vectors.js
          python3 scripts/test_guard_inspection.py
          python3 scripts/test_guard_primitive_reports.py
          python3 scripts/test_guard_reservation_reports.py
          python3 scripts/test_guard_dispatch_reports.py
          python3 scripts/test_guard_result_reports.py
          node scripts/generate_guard_client_vectors.js --check
          python3 scripts/test_guard_client_reports.py
          python3 scripts/generate_guard_mcp_vectors.py --check
          python3 scripts/test_guard_mcp_reports.py
          python3 scripts/generate_guard_rpc_vectors.py --check
          python3 scripts/test_guard_rpc_reports.py
          python3 scripts/test_guard_registry_reports.py
          python3 scripts/test_mcp_session_reports.py
          python3 scripts/test_guard_session_reports.py
          python3 scripts/test_mcp_setup.py
      - name: Audit Guard binding readiness
        run: |
          python3 scripts/test_guard_binding.py
          status=0
          python3 scripts/inspect_guard_binding.py --output "${RUNNER_TEMP}/guard-binding-readiness" || status=$?
          test "$status" -eq 3
      - name: Preserve Guard binding readiness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-binding-readiness-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-binding-readiness/
      - name: Run Inspector contract tests and record results
        run: |
          go build -o "${RUNNER_TEMP}/sage-scenario-tests" ./cmd/sage-scenario
          go build -o "${RUNNER_TEMP}/sage-conformance-tests" ./cmd/sage-conformance
          python3 scripts/run_verification_tests.py --scenario "${RUNNER_TEMP}/sage-scenario-tests" --primitive "${RUNNER_TEMP}/sage-conformance-tests" --output "${RUNNER_TEMP}/inspector-tests"
      - name: Preserve Inspector test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspector-tests-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/inspector-tests/
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  spec:
    name: Legacy spec vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-spec
          ref: f4a4e7fbf71a665785984eef7609b2e8fabe833d
          path: .sage-spec
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the vectors
        run: go run ./cmd/sage-inspector vectors -dir .sage-spec/vectors

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  evidence:
    name: Evidence integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate frozen evidence and coverage
        run: |
          python3 scripts/test_close_inspection.py
          python3 scripts/test_concurrent_inspection.py
          python3 scripts/test_replay_inspection.py
          python3 scripts/test_deployment_inspection.py
          python3 scripts/test_evidence_integration.py
          python3 scripts/integrate_evidence.py --check --output docs/evidence/integrated.json
      - name: Run reference foundation self-check
        run: |
          mkdir -p evidence-run
          go run ./cmd/sage-conformance -suite vectors/0.10.0/foundation.json -report evidence-run/reference.json
          python3 - <<'PYMETA'
          import json, os, platform, subprocess
          from pathlib import Path
          data = dict(inspector_revision=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                      purpose='Evidence validation and reference self-check; no fresh core execution',
                      python=platform.python_version(), platform=platform.platform(),
                      go=subprocess.check_output(['go', 'version'], text=True).strip())
          Path('evidence-run/ci.json').write_text(json.dumps(data, indent=2) + '\n')
          PYMETA
      - name: Preserve evidence and reproduction inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence-run/
            docs/evidence/
            verification/0.10.0/
            vectors/0.10.0/
            scripts/
            .github/workflows/ci.yml
            go.mod
            go.sum

  record010:
    name: Record API bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: sage-inspector
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SAGE-X-project/sage
          ref: be621819d8e4f3a51895ccf469617a0aa70ee81c
          path: sage
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SAGE-X-project/rs-sage-core
          ref: ad30c6ade287765ac96a500699469599b9696fcd
          path: rs-sage-core
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: sage-inspector/go.mod
          cache-dependency-path: sage-inspector/adapters/go/go.sum
      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Audit Guard deployment integration prerequisites
        working-directory: sage-inspector
        run: |
          status=0
          python3 scripts/inspect_guard_integration.py --go-root ../sage --rust-root ../rs-sage-core --output "${RUNNER_TEMP}/guard-integration-readiness" || status=$?
          test "$status" -eq 3
      - name: Preserve Guard integration review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-integration-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/guard-integration-readiness/
          if-no-files-found: error
          retention-days: 30
      - name: Audit authenticated MCP setup prerequisites
        working-directory: sage-inspector
        run: |
          setup_review_result=0
          python3 scripts/inspect_mcp_setup.py --go-root ../sage --rust-root ../rs-sage-core --output "${RUNNER_TEMP}/mcp-setup-review" || setup_review_result=$?
          test "$setup_review_result" -eq 3
      - name: Preserve MCP setup review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-setup-review-${{ github.sha }}
          path: ${{ runner.temp }}/mcp-setup-review/
          if-no-files-found: error
          retention-days: 30
      - name: Build pinned record adapters and verify local records
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          go build -o "${RUNNER_TEMP}/sage-conformance-record010" ./cmd/sage-conformance
          (cd adapters/go && go build -o "${RUNNER_TEMP}/sage-go-record010" .)
          cargo build --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust"
          python3 scripts/test_record010_adapters.py --go "${RUNNER_TEMP}/sage-go-record010" --rust "${RUNNER_TEMP}/record010-rust/debug/sage-inspector-rust-adapter" --runner "${RUNNER_TEMP}/sage-conformance-record010" --output "${RUNNER_TEMP}/record010-results"
      - name: Verify actual Guard primitive bindings
        working-directory: sage-inspector
        run: |
          node scripts/check_guard_vectors.js
          cmp vectors/0.10.0/guard-records.json ../sage/pkg/agent/guard010/testdata/guard-records.json
          cmp vectors/0.10.0/guard-records.json ../rs-sage-core/src/guard010/testdata/guard-records.json
          python3 scripts/test_guard_primitive_adapters.py --go "${RUNNER_TEMP}/sage-go-record010" --rust "${RUNNER_TEMP}/record010-rust/debug/sage-inspector-rust-adapter" --runner "${RUNNER_TEMP}/sage-conformance-record010" --output "${RUNNER_TEMP}/guard-primitive-results"
      - name: Preserve Guard primitive results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-primitive-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-primitive-results/
      - name: Verify Guard signature boundaries
        working-directory: sage-inspector
        run: |
          python3 -B scripts/test_guard_signature_boundaries.py
          python3 -B scripts/check_guard_signature_boundaries.py --go "${RUNNER_TEMP}/sage-go-record010" --rust "${RUNNER_TEMP}/record010-rust/debug/sage-inspector-rust-adapter" --go-root ../sage --rust-root ../rs-sage-core --output "${RUNNER_TEMP}/guard-signature-boundaries"
      - name: Preserve Guard signature boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-signature-boundaries-${{ github.sha }}
          path: ${{ runner.temp }}/guard-signature-boundaries/
          if-no-files-found: error
          retention-days: 30
      - name: Verify authenticated durable Guard reservations
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          (cd adapters/go && go build -o "${RUNNER_TEMP}/sage-guard-ledger010" ./cmd/sage-guard-ledger010)
          cargo build --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin guard_ledger010
          python3 scripts/test_guard_reservations010.py --go "${RUNNER_TEMP}/sage-guard-ledger010" --rust "${RUNNER_TEMP}/record010-rust/debug/guard_ledger010" --output "${RUNNER_TEMP}/guard-reservation-results"
      - name: Preserve Guard reservation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-reservation-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-reservation-results/
      - name: Verify serialized Guard dispatch commitments
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          (cd adapters/go && go build -o "${RUNNER_TEMP}/sage-guard-dispatch010" ./cmd/sage-guard-dispatch010)
          cargo build --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin guard_dispatch010
          python3 scripts/test_guard_dispatch010.py --go "${RUNNER_TEMP}/sage-guard-dispatch010" --rust "${RUNNER_TEMP}/record010-rust/debug/guard_dispatch010" --output "${RUNNER_TEMP}/guard-dispatch-results"
      - name: Preserve Guard dispatch results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-dispatch-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-dispatch-results/
      - name: Verify signed Guard result publication
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          (cd adapters/go && go build -o "${RUNNER_TEMP}/sage-guard-results010" ./cmd/sage-guard-results010)
          cargo build --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin guard_results010
          python3 scripts/test_guard_results010.py --go "${RUNNER_TEMP}/sage-guard-results010" --rust "${RUNNER_TEMP}/record010-rust/debug/guard_results010" --output "${RUNNER_TEMP}/guard-result-results"
      - name: Preserve Guard result publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-result-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-result-results/
      - name: Verify client terminal consumption and polling
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          node scripts/generate_guard_client_vectors.js --check
          cmp vectors/0.10.0/guard-client.json ../sage/pkg/agent/guard010/testdata/guard-client.json
          cmp vectors/0.10.0/guard-client.json ../rs-sage-core/src/guard010/testdata/guard-client.json
          (cd adapters/go && go build -o "${RUNNER_TEMP}/sage-guard-client010" ./cmd/sage-guard-client010)
          cargo build --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin guard_client010
          python3 scripts/test_guard_client010.py --go "${RUNNER_TEMP}/sage-guard-client010" --rust "${RUNNER_TEMP}/record010-rust/debug/guard_client010" --go-server "${RUNNER_TEMP}/sage-guard-results010" --rust-server "${RUNNER_TEMP}/record010-rust/debug/guard_results010" --output "${RUNNER_TEMP}/guard-client-results"
      - name: Preserve Guard client evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-client-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-client-results/
      - name: Verify retained record sessions
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          go build -o "${RUNNER_TEMP}/sage-scenario-record010" ./cmd/sage-scenario
          (cd adapters/go && go test -race ./cmd/sage-record010-state && go build -o "${RUNNER_TEMP}/sage-go-record010-state" ./cmd/sage-record010-state)
          cargo test --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin record010_state
          python3 scripts/test_record010_state.py --go "${RUNNER_TEMP}/sage-go-record010-state" --rust "${RUNNER_TEMP}/record010-rust/debug/record010_state" --runner "${RUNNER_TEMP}/sage-scenario-record010" --output "${RUNNER_TEMP}/record010-results/stateful"
      - name: Verify transcript-bound HPKE seed and ACK bindings
        working-directory: sage-inspector
        run: |
          node scripts/check_hpke_vectors.js
          python3 scripts/test_hpke010_adapters.py --go "${RUNNER_TEMP}/sage-go-record010" --rust "${RUNNER_TEMP}/record010-rust/debug/sage-inspector-rust-adapter" --output "${RUNNER_TEMP}/record010-results/hpke010"
      - name: Verify complete cryptographic derivation paths
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          python3 scripts/generate_hpke_derivation010.py --check
          (cd adapters/go && go test -race ./cmd/sage-hpke010 && go build -o "${RUNNER_TEMP}/sage-hpke010" ./cmd/sage-hpke010)
          cargo test --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin hpke010
          python3 scripts/test_hpke_derivation010.py --go "${RUNNER_TEMP}/sage-hpke010" --rust "${RUNNER_TEMP}/record010-rust/debug/hpke010" --output "${RUNNER_TEMP}/record010-results/derivation010"
      - name: Verify fresh registry observations and durable restart state
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          node scripts/check_registry_vectors.js
          python3 scripts/generate_registry010.py --check
          (cd adapters/go && go test -race ./cmd/sage-registry010 && go build -o "${RUNNER_TEMP}/sage-registry010" ./cmd/sage-registry010)
          cargo test --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin registry010
          python3 scripts/test_registry010.py --go "${RUNNER_TEMP}/sage-registry010" --rust "${RUNNER_TEMP}/record010-rust/debug/registry010" --output "${RUNNER_TEMP}/record010-results/registry010"
      - name: Verify authenticated completion and pending lifetime
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          python3 scripts/generate_completion010.py --check
          (cd adapters/go && go test -race ./cmd/sage-completion010 && go build -o "${RUNNER_TEMP}/sage-completion010" ./cmd/sage-completion010)
          cargo test --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin completion010
          python3 scripts/test_completion010.py --go "${RUNNER_TEMP}/sage-completion010" --rust "${RUNNER_TEMP}/record010-rust/debug/completion010" --output "${RUNNER_TEMP}/record010-results/completion010"
      - name: Verify authenticated session requests and atomic confirmation
        working-directory: sage-inspector
        run: python3 scripts/test_authenticated_record010.py --go "${RUNNER_TEMP}/sage-completion010" --rust "${RUNNER_TEMP}/record010-rust/debug/completion010" --output "${RUNNER_TEMP}/record010-results/authenticated-record010"
      - name: Verify exact session response correlation
        working-directory: sage-inspector
        run: python3 scripts/test_session_response010.py --go "${RUNNER_TEMP}/sage-completion010" --rust "${RUNNER_TEMP}/record010-rust/debug/completion010" --output "${RUNNER_TEMP}/record010-results/session-response010"
      - name: Verify HTTP session signatures and shared acceptance
        working-directory: sage-inspector
        run: |
          python3 scripts/test_http_session010_unit.py
          python3 scripts/test_http_session010.py --go "${RUNNER_TEMP}/sage-completion010" --rust "${RUNNER_TEMP}/record010-rust/debug/completion010" --output "${RUNNER_TEMP}/record010-results/http-session010"
      - name: Verify HTTP handshakes over authenticated loopback TLS
        working-directory: sage-inspector
        run: |
          python3 scripts/test_http_tls010_unit.py
          python3 scripts/test_http_handshake010.py --go "${RUNNER_TEMP}/sage-completion010" --rust "${RUNNER_TEMP}/record010-rust/debug/completion010" --output "${RUNNER_TEMP}/record010-results/http-handshake010"
      - name: Verify Structured Field serialization and URI preservation
        working-directory: sage-inspector
        run: |
          python3 scripts/test_http_serialization010_unit.py
          python3 scripts/test_http_serialization010.py --go "${RUNNER_TEMP}/sage-completion010" --rust "${RUNNER_TEMP}/record010-rust/debug/completion010" --output "${RUNNER_TEMP}/record010-results/http-serialization010"
      - name: Verify authenticated WebSocket exchanges
        working-directory: sage-inspector
        run: |
          python3 -m venv "${RUNNER_TEMP}/websocket010-venv"
          "${RUNNER_TEMP}/websocket010-venv/bin/pip" install -r scripts/requirements-websocket010.txt
          "${RUNNER_TEMP}/websocket010-venv/bin/python" scripts/test_websocket010_unit.py
          "${RUNNER_TEMP}/websocket010-venv/bin/python" scripts/test_websocket010.py --go "${RUNNER_TEMP}/sage-completion010" --rust "${RUNNER_TEMP}/record010-rust/debug/completion010" --output "${RUNNER_TEMP}/record010-results/websocket010"
      - name: Verify durable replay recovery and restart quarantine
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          (cd adapters/go && go build -o "${RUNNER_TEMP}/sage-replay010" ./cmd/sage-replay010)
          cargo build --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin replay010
          python3 scripts/test_replay_journal010.py --go "${RUNNER_TEMP}/sage-replay010" --rust "${RUNNER_TEMP}/record010-rust/debug/replay010" --output "${RUNNER_TEMP}/record010-results/replay-journal010"
      - name: Verify execution ledger recovery across core processes
        working-directory: sage-inspector
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          (cd adapters/go && go build -o "${RUNNER_TEMP}/sage-execution010" ./cmd/sage-execution010)
          cargo build --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin execution010
          python3 scripts/test_execution_ledger010.py --go "${RUNNER_TEMP}/sage-execution010" --rust "${RUNNER_TEMP}/record010-rust/debug/execution010" --output "${RUNNER_TEMP}/record010-results/execution-ledger010"
      - name: Preserve record binding test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: record010-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/record010-results/

      - name: Verify MCP result bindings and client consumption
        working-directory: sage-inspector
        run: |
          cmp vectors/0.10.0/guard-mcp.json ../sage/pkg/agent/guard010/testdata/guard-mcp.json
          cmp vectors/0.10.0/guard-mcp.json ../rs-sage-core/src/guard010/testdata/guard-mcp.json
          python3 scripts/test_guard_mcp010.py --go "${RUNNER_TEMP}/sage-go-record010" --rust "${RUNNER_TEMP}/record010-rust/debug/sage-inspector-rust-adapter" --go-client "${RUNNER_TEMP}/sage-guard-client010" --rust-client "${RUNNER_TEMP}/record010-rust/debug/guard_client010" --output "${RUNNER_TEMP}/guard-mcp-results"
      - name: Preserve MCP result verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-mcp-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-mcp-results/

      - name: Verify MCP RPC dispatch and client bindings
        working-directory: sage-inspector
        run: |
          cmp vectors/0.10.0/guard-rpc.json ../sage/pkg/agent/guard010/testdata/guard-rpc.json
          cmp vectors/0.10.0/guard-rpc.json ../rs-sage-core/src/guard010/testdata/guard-rpc.json
          cmp ../sage/pkg/agent/guard010/mcp-tool.json ../rs-sage-core/src/guard010/mcp-tool.json
          python3 scripts/test_guard_rpc010.py --go "${RUNNER_TEMP}/sage-guard-results010" --rust "${RUNNER_TEMP}/record010-rust/debug/guard_results010" --go-client "${RUNNER_TEMP}/sage-guard-client010" --rust-client "${RUNNER_TEMP}/record010-rust/debug/guard_client010" --output "${RUNNER_TEMP}/guard-rpc-results"
      - name: Preserve MCP RPC verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-rpc-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-rpc-results/

      - name: Verify fresh registry authority at Guard dispatch
        working-directory: sage-inspector
        run: |
          (cd adapters/go && go build -o "${RUNNER_TEMP}/sage-guard-registry010" ./cmd/sage-guard-registry010)
          cargo build --locked --manifest-path adapters/rust/Cargo.toml --target-dir "${RUNNER_TEMP}/record010-rust" --bin guard_registry010
          python3 scripts/test_guard_registry010.py --go "${RUNNER_TEMP}/sage-guard-registry010" --rust "${RUNNER_TEMP}/record010-rust/debug/guard_registry010" --output "${RUNNER_TEMP}/guard-registry-results"
      - name: Preserve Guard registry authority verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-registry-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-registry-results/

      - name: Verify MCP session bindings across cores
        working-directory: sage-inspector
        timeout-minutes: 5
        run: python3 scripts/test_mcp_session010.py --go "${RUNNER_TEMP}/sage-completion010" --rust "${RUNNER_TEMP}/record010-rust/debug/completion010" --output "${RUNNER_TEMP}/mcp-session-results"
      - name: Preserve MCP session binding verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-session-bindings-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/mcp-session-results/

      - name: Verify protected Guard dispatch and durable client consumption
        working-directory: sage-inspector
        timeout-minutes: 5
        run: >-
          python3 scripts/test_guard_session010.py
          --go-session "${RUNNER_TEMP}/sage-completion010"
          --rust-session "${RUNNER_TEMP}/record010-rust/debug/completion010"
          --go-server "${RUNNER_TEMP}/sage-guard-results010"
          --rust-server "${RUNNER_TEMP}/record010-rust/debug/guard_results010"
          --go-client "${RUNNER_TEMP}/sage-guard-client010"
          --rust-client "${RUNNER_TEMP}/record010-rust/debug/guard_client010"
          --output "${RUNNER_TEMP}/guard-session-results"
      - name: Preserve protected Guard flow verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-session-flow-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/guard-session-results/

  mcp-setup-model:
