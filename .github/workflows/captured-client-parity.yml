name: Captured Client public API parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    name: Signed Client capture and restart parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage
          ref: 8c29b785e36fe8f7d7dc9e55bd9deb036df0088f
          path: .sage-go
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/rs-sage-core
          ref: c99d373b772a3fb33e166fda3e07ee7ba94414f0
          path: .sage-rust
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - name: Fetch public dependencies
        run: |
          (cd .sage-go && go mod download)
          cargo fetch --manifest-path .sage-rust/Cargo.toml
          python3 -m venv "${RUNNER_TEMP}/capture-venv"
          "${RUNNER_TEMP}/capture-venv/bin/pip" install 'cryptography==50.0.0'
      - name: Audit external public host APIs
        run: |
          python3 -B scripts/inspect_host_public_api.py \
            --go-root .sage-go --rust-root .sage-rust \
            --output "${RUNNER_TEMP}/host-public-api.json"
          cmp docs/evidence/host-public-api.json "${RUNNER_TEMP}/host-public-api.json"
          python3 -B scripts/test_host_public_api.py
      - name: Run independent signed Client consumers
        run: |
          test -z "$(gofmt -d adapters/captured-client/go/*.go.txt)"
          "${RUNNER_TEMP}/capture-venv/bin/python" -B scripts/inspect_captured_client_parity.py \
            --go-root .sage-go --rust-root .sage-rust \
            --output "${RUNNER_TEMP}/captured-client-parity.json"
          cmp docs/evidence/captured-client-parity.json "${RUNNER_TEMP}/captured-client-parity.json"
          "${RUNNER_TEMP}/capture-venv/bin/python" -B scripts/test_captured_client_parity.py
          "${RUNNER_TEMP}/capture-venv/bin/python" -B scripts/inspect_captured_client_results.py \
            --go-root .sage-go --rust-root .sage-rust \
            --output "${RUNNER_TEMP}/captured-client-results.json"
          cmp docs/evidence/captured-client-results.json "${RUNNER_TEMP}/captured-client-results.json"
          "${RUNNER_TEMP}/capture-venv/bin/python" -B scripts/test_captured_client_results.py
