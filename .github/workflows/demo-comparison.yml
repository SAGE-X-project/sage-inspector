name: Demo comparison

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    name: Observe the pinned demo with and without SAGE
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-demo
          ref: c7e64adf486f394b2c9bdbefc4d95a83a742a831
          path: .sage-demo
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Fetch pinned public dependencies
        env:
          GOWORK: 'off'
          GOFLAGS: '-mod=readonly'
        run: cd .sage-demo && go mod download
      - name: Prepare Python evidence checker
        run: |
          python3 -m venv "${RUNNER_TEMP}/demo-venv"
          "${RUNNER_TEMP}/demo-venv/bin/pip" install 'cryptography==50.0.0'
      - name: Check saved evidence and refusal units
        run: |
          if [ -f docs/evidence/demo-comparison.json ]; then
            "${RUNNER_TEMP}/demo-venv/bin/python" -B scripts/inspect_demo_comparison.py
            "${RUNNER_TEMP}/demo-venv/bin/python" -B scripts/test_demo_comparison.py
          fi
      - name: Observe a fresh comparison
        run: |
          "${RUNNER_TEMP}/demo-venv/bin/python" -B scripts/inspect_demo_comparison.py \
            --demo-root .sage-demo --output "${RUNNER_TEMP}/demo-comparison.json"
      - name: Preserve the observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-comparison-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: ${{ runner.temp }}/demo-comparison.json
