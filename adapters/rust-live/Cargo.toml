[package]
name = "sage-inspector-rust-live-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[features]
default = ["liveweb010"]
liveweb010 = []

[[bin]]
name = "completion010_live"
path = "../rust/src/bin/completion010.rs"

[[bin]]
name = "guard_results010_live"
path = "../rust/src/bin/guard_results010.rs"

[dependencies]
sage_crypto_core = { path = "../../../rs-sage-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.11"
http = "1.5"
httparse = "1.10"
base64 = "0.23"
pem = "4.0"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
