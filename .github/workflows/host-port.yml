name: Protected host-port contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sage-inspector
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-spec
          ref: f97378cde7f29006520299c4246d2a50a429545f
          path: sage-spec
      - name: Check protected host-port controls
        working-directory: sage-inspector
        env:
          SAGE_SPEC_ROOT: ../sage-spec
        run: |
          python3 -B scripts/test_host_port_contract.py
          python3 -B scripts/host_port_contract.py --spec-root ../sage-spec > "${RUNNER_TEMP}/host-port-report.json"
      - name: Preserve the no-subject report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-port-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: ${{ runner.temp }}/host-port-report.json
